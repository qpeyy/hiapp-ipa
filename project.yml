name: HiApp
options:
  bundleIdPrefix: com.henry
  deploymentTarget:
    iOS: "15.0"
targets:
  HiApp:
    type: application
    platform: iOS
    sources:
      - HiApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henry.hiapp
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "5.9"
    info:
      path: HiApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
